# Máy dev:  docker compose up -d db        (chỉ db; bot chạy bằng `uv run qltt bot`)
# Máy chủ:  docker compose up -d --build    (db + bot, tự chạy lại khi máy khởi động; DEPLOY.md)
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: qltt
      POSTGRES_DB: qltt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chua dat POSTGRES_PASSWORD trong file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qltt -d qltt"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Không mở cổng ở đây: trên máy chủ chỉ container bot gọi được db.

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db  # tên service, trong mạng nội bộ của compose
      DB_PORT: "5432"
    volumes:
      - ./secrets:/app/secrets:ro  # khóa service account Google
      - ./data/raw:/app/data/raw  # bản sao docx tải từ Drive
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  pgdata:
